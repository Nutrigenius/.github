name: 🐛 Bug
description: Quelque chose ne marche pas comme prévu.
type: Bug
body:
  - type: dropdown
    id: domaine
    attributes:
      label: Domaine
      description: Le label correspondant est ajouté automatiquement.
      options:
        - "restaurateur — onboarding, liaison d'un restaurant, menus, plats"
        - "compte — inscription, connexion, profil"
        - "ia — analyse IA, allergènes, import de menu"
        - "carte — carte et recherche de restaurants"
        - "paiement — paywall, abonnements"
        - "boutique — commandes, livraison"
        - "social — créateurs, avis, contenus partagés"
        - "config — projets Firebase, clés d'API, flavors"
        - "technique — build, CI, environnement de dev (Flutter, Xcode, CocoaPods)"
    validations:
      required: true
  - type: checkboxes
    id: securite
    attributes:
      label: Sécurité
      options:
        - label: C'est une faille de sécurité (le label `sécurité` est ajouté automatiquement)
  - type: textarea
    id: symptome
    attributes:
      label: Symptôme
      description: Ce qui se passe, et ce qui devrait se passer.
    validations:
      required: true
  - type: textarea
    id: reproduire
    attributes:
      label: Comment le reproduire
      placeholder: "1. Ouvrir… 2. Cliquer sur… 3. …"
  - type: dropdown
    id: environnement
    attributes:
      label: Où ça arrive
      options: ["App en dev (flavor dev)", "App en prod (flavor prod)", "Les deux", "Côté serveur / Cloud Functions", "Je ne sais pas"]
    validations:
      required: true
  - type: input
    id: ou
    attributes:
      label: Écran, fichier ou fonction concerné
  - type: textarea
    id: piste
    attributes:
      label: Piste
      description: Cause supposée ou idée de correction, si tu en as une.
