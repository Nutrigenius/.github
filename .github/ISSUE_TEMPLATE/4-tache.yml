name: 🔧 Tâche
description: Travail technique, déploiement, outillage, ménage.
type: Task
body:
  - type: markdown
    attributes:
      value: |
        **Pour une mise en prod** : dans le projet, mets le champ **Prod** à « À déployer », et rattache cette tâche au sujet concerné en sous-issue. Elle sortira du Tableau et apparaîtra dans la vue « À déployer en prod ».
  - type: dropdown
    id: domaine
    attributes:
      label: Domaine
      description: Le label correspondant est ajouté automatiquement.
      options:
        - "restaurateur — onboarding, liaison d'un restaurant, menus, plats"
        - "compte — inscription, connexion, profil"
        - "ia — analyse IA, allergènes, import de menu"
        - "carte — carte et recherche de restaurants"
        - "paiement — paywall, abonnements"
        - "boutique — commandes, livraison"
        - "social — créateurs, avis, contenus partagés"
        - "config — projets Firebase, clés d'API, flavors"
        - "technique — build, CI, environnement de dev (Flutter, Xcode, CocoaPods)"
    validations:
      required: true
  - type: textarea
    id: quoi
    attributes:
      label: Quoi
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: Comment / commandes
      description: Étapes, ordre, prérequis.
